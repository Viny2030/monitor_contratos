name: Monitor Diario Integrado BORA + Comprar + TGN

on:
  schedule:
    - cron: '0 12 * * 1-5'  # 09:00 Argentina (UTC-3), lunes a viernes
    - cron: '0 15 * * 1-5'  # 12:00 Argentina: reintento si el BORA no respondió (si ya hay reporte no hace nada)
  workflow_dispatch:          # permite ejecución manual desde GitHub

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Descargar código ──────────────────────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ── 2. Configurar Python ─────────────────────────────────
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. Instalar dependencias ─────────────────────────────
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Capturar fecha del run ────────────────────────────
      - name: Capturar fecha
        id: fecha
        run: echo "fecha=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # ── 4b. ¿La corrida de la mañana ya generó el reporte? ───
      # Si ya existe, diario.py no hace nada; antes el análisis de concentración
      # se regeneraba igual y producía un segundo commit "Monitor diario" por día.
      - name: Verificar reporte del día
        id: previo
        run: |
          if ls data/*/reporte_$(date +'%Y-%m-%d').xlsx >/dev/null 2>&1; then
            echo "existe=true" >> $GITHUB_OUTPUT
          else
            echo "existe=false" >> $GITHUB_OUTPUT
          fi

      # ── 5. Ciclo diario principal ────────────────────────────
      - name: Ejecutar diario.py (BORA + Comprar + TGN)
        run: python diario.py
        env:
          TGN_TOKEN: ${{ secrets.TGN_TOKEN }}

      # ── 6. Análisis de concentración (sistémico) ─────────────
      - name: Ejecutar analisis_concentracion.py
        if: steps.previo.outputs.existe != 'true'
        run: python analisis_concentracion.py --exportar
        continue-on-error: true

      # ── 6b. Reintentar avisos incompletos de la última semana ─
      # Vuelve a leer del BORA los avisos sin CUIT, proveedor o monto (a veces el PDF
      # no está disponible a la mañana) y guarda lo recuperado en data/correcciones/.
      # No modifica los reportes: el sitio solo completa celdas vacías.
      - name: Reintentar avisos incompletos
        run: python tools/reextraer_avisos.py --desde $(date -d '7 days ago' +'%Y-%m-%d') --pausa 3
        timeout-minutes: 30
        continue-on-error: true

      # ── 6c. Armar alertas del día (riesgo Alto y MEACI) ───────
      # Solo si el reporte de hoy es nuevo, para no repetir el aviso en la corrida de las 12:00.
      - name: Armar alertas del día
        id: alertas
        if: steps.previo.outputs.existe != 'true'
        run: python tools/alertas_dia.py --salida alertas.txt
        continue-on-error: true

      # ── 7. Guardar y sincronizar ─────────────────────────────
      - name: Commit y push de reportes generados
        run: |
          git config --global user.name  'Robot Monitor'
          git config --global user.email 'robot@noreply.github.com'
          git add data/
          git add data/perfiles/ 2>/dev/null || true
          git add data/analisis/ 2>/dev/null || true
          git diff --staged --quiet \
            && echo "Sin cambios nuevos — nada que commitear" \
            && exit 0
          git stash
          git fetch origin main
          git rebase origin/main
          git stash pop
          git add data/
          git add data/perfiles/ 2>/dev/null || true
          git add data/analisis/ 2>/dev/null || true
          git commit -m "Monitor diario $(date +'%Y-%m-%d') — BORA+Comprar+TGN+Concentración"
          git push origin HEAD:main

      # ── 7b. Invalidar caché en Railway ───────────────────────
      - name: Notificar refresh a Railway
        run: |
          echo "Llamando a /api/refresh en Railway..."
          STATUS=$(curl -s -o /tmp/rail_resp.json -w "%{http_code}" \
            -X POST \
            -H "x-refresh-token: ${{ secrets.REFRESH_TOKEN }}" \
            https://monitorcontratos-production.up.railway.app/api/refresh)
          cat /tmp/rail_resp.json
          echo ""
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "202" ]; then
            echo "✅ Railway recibió el pedido de recarga (corre en segundo plano)"
          else
            echo "⚠️ Railway respondió HTTP $STATUS — los datos se cargarán en el próximo request"
          fi
        continue-on-error: true

      # ── 8. Mail solo si hay alertas ──────────────────────────
      # Antes llegaba un "OK" todos los días; ahora el mail llega solo cuando hay
      # adjudicaciones de riesgo Alto o CUITs con sanciones internacionales.
      - name: Notificar alertas
        if: success() && steps.alertas.outputs.hay_alertas == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          to: ${{ secrets.MAIL_TO }}
          from: Monitor BORA <${{ secrets.MAIL_USER }}>
          subject: "🚨 Monitor de Contratos — alertas del ${{ steps.fecha.outputs.fecha }}"
          body: file://alertas.txt

      # ── 9. Notificación de fallo ─────────────────────────────
      - name: Notificar fallo
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          to: ${{ secrets.MAIL_TO }}
          from: Monitor BORA <${{ secrets.MAIL_USER }}>
          subject: "❌ Monitor diario FALLÓ — ${{ steps.fecha.outputs.fecha }}"
          body: |
            ⚠️ El ciclo diario falló y requiere revisión.
            🔗 Ver logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Causas comunes:
            - BORA / Comprar / TGN no respondieron
            - Error en el código de scraping
            - Problema de autenticación en el push